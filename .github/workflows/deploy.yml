# ============================================================
# deploy.yml — CI/CD pipeline for Space Exploration with AI
#
# Triggers:
#   - push to any feat/* branch   → validate + deploy to STAGING
#   - push to main branch         → validate + deploy to PRODUCTION
#   - pull_request to main        → validate only (no deploy)
#   - manual workflow_dispatch    → choose environment manually
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   RENDER_API_KEY          Render.com API key
#   RENDER_SERVICE_ID_STAGING   Render staging service ID
#   RENDER_SERVICE_ID_PROD      Render production service ID
#   WATSONX_API_KEY         IBM watsonx API key
#   WATSONX_URL             IBM watsonx endpoint URL
#   WATSONX_PROJECT_ID      IBM watsonx project ID
#   SPACETRACK_USER         Space-Track.org username
#   SPACETRACK_PASSWORD     Space-Track.org password
#   N2YO_API_KEY            N2YO API key
#
# Architecture note: The app is two processes in one deployment unit —
#   Node.js gateway (web-gateway/) spawns Python MCP server (mcp-server/)
#   as a stdio subprocess. Render.com Native Runtime is used (no Docker).
# ============================================================

name: Validate & Deploy

on:
  push:
    branches:
      - "dev"
      - "main"
      - "feat/**"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# Cancel in-progress runs on the same branch to avoid deploy races
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Python validation
  # ──────────────────────────────────────────────────────────
  validate-python:
    name: "Validate Python (mcp-server)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mcp-server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports resolve (catches missing httpx etc.)
        run: |
          python -c "
          import sys, importlib, importlib.util
          modules = ['satellite_utils', 'ai_analysis', 'spacetrack', 'space_weather', 'n2yo']
          ok = True
          for m in modules:
            try:
              spec = importlib.util.spec_from_file_location(m, f'{m}.py')
              # Only check syntax — don't execute module-level network calls
              import ast, pathlib
              src = pathlib.Path(f'{m}.py').read_text()
              ast.parse(src)
              print(f'  ✅  {m}.py — syntax OK')
            except SyntaxError as e:
              print(f'  ❌  {m}.py — SyntaxError: {e}')
              ok = False
          sys.exit(0 if ok else 1)
          "

      - name: Verify all requirements are importable
        run: |
          pip check
          python -c "import httpx, skyfield, dotenv, fastmcp; print('Core packages OK')"

      - name: Lint with flake8 (warnings only — no gate)
        continue-on-error: true
        run: |
          pip install flake8 --quiet
          flake8 . --max-line-length=120 --extend-ignore=E203,W503 \
            --exclude=venv --format='%(path)s:%(row)d  %(code)s  %(text)s' \
            || true

  # ──────────────────────────────────────────────────────────
  # JOB 2: Node.js validation (runs in PARALLEL with Job 1)
  # ──────────────────────────────────────────────────────────
  validate-node:
    name: "Validate Node.js (web-gateway)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax (node --check)
        run: |
          node --check server.js
          node --check mcpClient.js
          echo "✅  Node.js syntax OK"

      - name: Verify package integrity
        run: npm audit --audit-level=high || true

  # ──────────────────────────────────────────────────────────
  # JOB 3: Integration smoke-test
  # Starts the gateway (which spawns the Python server) and
  # hits real endpoints — runs AFTER both validate jobs pass
  # ──────────────────────────────────────────────────────────
  smoke-test:
    name: "Smoke Test — live endpoints"
    runs-on: ubuntu-latest
    needs: [validate-python, validate-node]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mcp-server/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-gateway/package-lock.json

      - name: Install Python dependencies
        run: pip install -r mcp-server/requirements.txt

      - name: Install Node.js dependencies
        run: npm ci
        working-directory: web-gateway

      - name: Write minimal .env (no real credentials needed for smoke test)
        run: |
          cat > mcp-server/.env << 'EOF'
          # Smoke-test env — all credential-gated tools will return graceful "not configured" responses
          BROADCAST_GROUP=stations
          BROADCAST_LIMIT=3
          BROADCAST_INTERVAL_MS=60000
          PORT=3099
          EOF

      - name: Start gateway in background
        run: |
          export PYTHON_COMMAND=python3
          PORT=3099 node web-gateway/server.js &
          echo "GATEWAY_PID=$!" >> $GITHUB_ENV
          # Wait up to 30s for the server to be ready.
          # Uses /api/coverage (pure local math, no external network calls)
          # so the readiness check itself cannot fail due to third-party APIs.
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf "http://localhost:3099/api/coverage?altitude_km=408" > /dev/null 2>&1; then
              echo "✅  Gateway ready after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌  Gateway did not start within 30s"
              exit 1
            fi
          done

      - name: Smoke test — local computation (no external network required)
        run: |
          set -e
          # /api/coverage calls get_coverage_zone — pure spherical-Earth math,
          # no network I/O. Proves the full MCP pipe works:
          #   curl → Node gateway → Python subprocess → tool → JSON response
          echo "Testing /api/coverage (pure local math) ..."
          curl -s --fail-with-body "http://localhost:3099/api/coverage?altitude_km=408" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'coverage_radius_km' in d, f'Bad coverage response: {d}'
          print(f'  ✅  Coverage at 408 km: radius={d[\"coverage_radius_km\"]} km')
          "

          echo "Testing /api/coverage at 550 km (Starlink altitude) ..."
          curl -s --fail-with-body "http://localhost:3099/api/coverage?altitude_km=550" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'coverage_radius_km' in d, f'Bad coverage response: {d}'
          r = d['coverage_radius_km']
          assert 2000 < r < 4000, f'Coverage radius {r} km outside expected range for 550 km orbit'
          print(f'  ✅  Coverage at 550 km: radius={r} km (physics check passed)')
          "

          # External endpoints — report result but never fail the build.
          # These depend on third-party APIs (Open Notify, NOAA, Celestrak)
          # that are unreliable from GitHub Actions runners.
          echo "Testing /api/iss (external — informational only) ..."
          curl -s --max-time 8 "http://localhost:3099/api/iss" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            if 'latitude' in d:
              print(f'  ✅  ISS position: {d[\"latitude\"]:.2f}, {d[\"longitude\"]:.2f}')
            else:
              print(f'  ⚠️   ISS API unavailable (external): {d}')
          except Exception as e:
            print(f'  ⚠️   ISS response unreadable: {e}')
          " || true

          echo "Testing /api/astronauts (external — informational only) ..."
          curl -s --max-time 8 "http://localhost:3099/api/astronauts" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            if 'count' in d:
              print(f'  ✅  {d[\"count\"]} astronauts in space')
            else:
              print(f'  ⚠️   Astronauts API unavailable (external): {d}')
          except Exception as e:
            print(f'  ⚠️   Astronauts response unreadable: {e}')
          " || true

      - name: Stop gateway
        if: always()
        run: kill $GATEWAY_PID 2>/dev/null || true

  # ──────────────────────────────────────────────────────────
  # JOB 4a: Deploy to STAGING
  # Runs when: push to feat/* OR manual dispatch targeting staging
  # Uses Render.com Deploy Hook
  # ──────────────────────────────────────────────────────────
  deploy-staging:
    name: "Deploy → Staging"
    runs-on: ubuntu-latest
    needs: [smoke-test]
    environment: staging
    if: |
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feat/') || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
        run: |
          missing=()
          [ -z "$RENDER_API_KEY" ]    && missing+=("RENDER_API_KEY")
          [ -z "$RENDER_SERVICE_ID" ] && missing+=("RENDER_SERVICE_ID_STAGING")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌  Missing GitHub secrets: ${missing[*]}"
            echo "    Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Resolve Render staging service ID
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
        run: |
          # If the secret already looks like a proper srv- ID, use it directly.
          # Otherwise treat it as a service name and resolve via the API.
          if [[ "$RENDER_SERVICE_ID" == srv-* ]]; then
            echo "  ✅  Using service ID from secret: $RENDER_SERVICE_ID"
            echo "RESOLVED_SERVICE_ID=$RENDER_SERVICE_ID" >> $GITHUB_ENV
          else
            echo "  Secret looks like a name, not an ID — resolving via Render API..."
            HTTP_STATUS=$(curl -s -o /tmp/render_services.json -w "%{http_code}" \
              "https://api.render.com/v1/services?name=${RENDER_SERVICE_ID}&limit=5" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")
            echo "  Services lookup HTTP $HTTP_STATUS: $(cat /tmp/render_services.json)"
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "❌  Render services lookup failed (HTTP $HTTP_STATUS)"
              exit 1
            fi
            SVC_ID=$(python3 -c "
          import json, sys
          data = json.load(open('/tmp/render_services.json'))
          name = '${RENDER_SERVICE_ID}'
          for item in data:
            svc = item.get('service', item)
            if svc.get('name') == name:
              print(svc['id'])
              sys.exit(0)
          print('NOT_FOUND')
            ")
            if [ "$SVC_ID" = "NOT_FOUND" ]; then
              echo "❌  No service named '${RENDER_SERVICE_ID}' found in your Render account."
              echo "    Available services:"
              python3 -c "import json; [print('   ', i.get('service',i).get('name'), '-', i.get('service',i).get('id')) for i in json.load(open('/tmp/render_services.json'))]"
              exit 1
            fi
            echo "  ✅  Resolved '$RENDER_SERVICE_ID' → $SVC_ID"
            echo "RESOLVED_SERVICE_ID=$SVC_ID" >> $GITHUB_ENV
          fi

      - name: Trigger Render staging deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "🚀  Deploying to staging (Render service: $RESOLVED_SERVICE_ID)..."
          for attempt in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /tmp/render_response.json -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/${RESOLVED_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}')
            echo "  [attempt ${attempt}/3] Render API status: $HTTP_STATUS"
            echo "  Render API response: $(cat /tmp/render_response.json)"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              break
            fi
            if [ "$HTTP_STATUS" -ge 400 ] && [ "$HTTP_STATUS" -lt 500 ]; then
              echo "❌  Render API returned HTTP $HTTP_STATUS (client error — not retrying)"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "  ⏳  Render 5xx — retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
            else
              echo "❌  Render API returned HTTP $HTTP_STATUS after 3 attempts"
              exit 1
            fi
          done
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/render_response.json'))['deploy']['id'])")
          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          echo "  Deploy triggered: $DEPLOY_ID"

      - name: Wait for deploy to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "⏳  Waiting for staging deploy to complete..."
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(curl -s --fail-with-body \
              "https://api.render.com/v1/services/${RESOLVED_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['deploy']['status'])")
            echo "  [${i}/30] status: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "✅  Staging deploy live!"
              break
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "❌  Deploy $STATUS"
              exit 1
            fi
          done

      - name: Post staging URL to summary
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_STAGING }}
        run: |
          echo "## 🛰️ Staging Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Staging URL is shown in your Render dashboard for service \`$RENDER_SERVICE_ID\`." >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────
  # JOB 4b: Deploy to PRODUCTION
  # Runs when: push to main OR manual dispatch targeting production
  # ──────────────────────────────────────────────────────────
  deploy-production:
    name: "Deploy → Production"
    runs-on: ubuntu-latest
    needs: [smoke-test]
    environment: production
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}
        run: |
          missing=()
          [ -z "$RENDER_API_KEY" ]    && missing+=("RENDER_API_KEY")
          [ -z "$RENDER_SERVICE_ID" ] && missing+=("RENDER_SERVICE_ID_PROD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌  Missing GitHub secrets: ${missing[*]}"
            echo "    Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Resolve Render production service ID
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD }}
        run: |
          if [[ "$RENDER_SERVICE_ID" == srv-* ]]; then
            echo "  ✅  Using service ID from secret: $RENDER_SERVICE_ID"
            echo "RESOLVED_SERVICE_ID=$RENDER_SERVICE_ID" >> $GITHUB_ENV
          else
            echo "  Secret looks like a name, not an ID — resolving via Render API..."
            HTTP_STATUS=$(curl -s -o /tmp/render_services.json -w "%{http_code}" \
              "https://api.render.com/v1/services?name=${RENDER_SERVICE_ID}&limit=5" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")
            echo "  Services lookup HTTP $HTTP_STATUS: $(cat /tmp/render_services.json)"
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "❌  Render services lookup failed (HTTP $HTTP_STATUS)"
              exit 1
            fi
            SVC_ID=$(python3 -c "
          import json, sys
          data = json.load(open('/tmp/render_services.json'))
          name = '${RENDER_SERVICE_ID}'
          for item in data:
            svc = item.get('service', item)
            if svc.get('name') == name:
              print(svc['id'])
              sys.exit(0)
          print('NOT_FOUND')
            ")
            if [ "$SVC_ID" = "NOT_FOUND" ]; then
              echo "❌  No service named '${RENDER_SERVICE_ID}' found in your Render account."
              echo "    Available services:"
              python3 -c "import json; [print('   ', i.get('service',i).get('name'), '-', i.get('service',i).get('id')) for i in json.load(open('/tmp/render_services.json'))]"
              exit 1
            fi
            echo "  ✅  Resolved '$RENDER_SERVICE_ID' → $SVC_ID"
            echo "RESOLVED_SERVICE_ID=$SVC_ID" >> $GITHUB_ENV
          fi

      - name: Trigger Render production deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "🚀  Deploying to production (Render service: $RESOLVED_SERVICE_ID)..."
          for attempt in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /tmp/render_response.json -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/${RESOLVED_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}')
            echo "  [attempt ${attempt}/3] Render API status: $HTTP_STATUS"
            echo "  Render API response: $(cat /tmp/render_response.json)"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              break
            fi
            if [ "$HTTP_STATUS" -ge 400 ] && [ "$HTTP_STATUS" -lt 500 ]; then
              echo "❌  Render API returned HTTP $HTTP_STATUS (client error — not retrying)"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "  ⏳  Render 5xx — retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
            else
              echo "❌  Render API returned HTTP $HTTP_STATUS after 3 attempts"
              exit 1
            fi
          done
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/render_response.json'))['deploy']['id'])")
          echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          echo "  Deploy triggered: $DEPLOY_ID"

      - name: Wait for deploy to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "⏳  Waiting for production deploy to complete..."
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(curl -s --fail-with-body \
              "https://api.render.com/v1/services/${RESOLVED_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['deploy']['status'])")
            echo "  [${i}/30] status: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "✅  Production deploy live!"
              break
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "❌  Deploy $STATUS"
              exit 1
            fi
          done

      - name: Post production URL to summary
        run: |
          echo "## 🚀 Production Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
